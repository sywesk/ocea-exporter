services:
  ocea-exporter:
    build: .
    image: ocea-exporter:local
    container_name: ocea-exporter
    restart: unless-stopped
    environment:
      OCEA_EXPORTER_STATE_FILE_PATH: /data/state.json
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ocea-state:/data

volumes:
  ocea-state:
