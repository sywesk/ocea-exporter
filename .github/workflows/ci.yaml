name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go mod verify
      - run: go test ./... -cover
      - run: go vet ./...
      - run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
      - run: go build ./...
      - name: Check for data races
        if: runner.os == 'Linux'
        run: go test -race ./...
      - name: Scan called code and imported packages
        if: runner.os == 'Linux'
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 -scan package ./...
      - name: Build container
        if: runner.os == 'Linux'
        run: docker build -t ocea-exporter:ci .
